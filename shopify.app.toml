# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "c6f8088fe21f2043fc863899e6c7ae66"
name = "StockyShift "
application_url = "https://stockyshift.com"
embedded = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = [ "app/uninstalled" ]
  [[webhooks.subscriptions]]
  uri = "/webhooks/gdpr"
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_inventory,read_inventory,read_products,write_products"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://stockyshift.com/auth/callback",
  "https://stockyshift.com/billing/confirm"
]

[app_proxy]
url = "https://stockyshift.com/apps/stockyshift"
subpath = "stockyshift"
prefix = "apps"
