services:
  - type: web
    name: stockyshift
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SCOPES
        value: read_products,write_products,read_inventory,write_inventory,write_recurring_charges
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: APP_URL
        sync: false
      - key: SMTP_HOST
        value: live.smtp.mailtrap.io
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_USER
        value: api
      - key: SMTP_PASS
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: DB_PATH
        sync: false
