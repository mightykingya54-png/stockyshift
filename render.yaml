services:
  - type: web
    name: stockyshift
    env: node
    buildCommand: npm install
    startCommand: node server.js
    # Persistent disk for SQLite database (required — without it, all data is lost on deploy)
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SCOPES
        value: read_products,write_products,read_inventory,write_inventory
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PORT
        value: 10000
      - key: APP_URL
        sync: false
      - key: DB_PATH
        value: /data/stockyshift.db
      # Production: Resend SMTP (update after creating account + verifying domain)
      - key: SMTP_HOST
        value: smtp.resend.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: resend
      - key: SMTP_PASS
        sync: false
      - key: FROM_EMAIL
        value: purchase-orders@stockyshift.com
      # Billing: set to "false" for real charges. Use "true" only for local dev.
      - key: BILLING_TEST_MODE
        value: "false"
